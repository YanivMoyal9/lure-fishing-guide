<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ניהול פניות | ארסנל הז׳רז׳ור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#102f3b;--navy-deep:#092631;--teal:#157c83;--teal-deep:#126068;--orange:#c4542c;--ink:#1a3440;--muted:#607983;--line:#d7e3e2;--ground:#f5f8f7;--ok:#1f7a4a;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:500 15px/1.5 Assistant,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.top{background:var(--navy-deep);color:#fff}
.top .in{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font:900 20px Heebo,Arial,sans-serif;letter-spacing:-.03em}
.top h1 small{display:block;font:600 12px Assistant,Arial,sans-serif;color:#abcbd0;letter-spacing:0}
.top a,.top button{color:#fff;background:none;border:1px solid #587885;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:800;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.login{max-width:440px;margin:40px auto}
.login h2{margin:0 0 6px;font:800 24px Heebo,Arial,sans-serif}
.login p{margin:0 0 16px;color:var(--muted)}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;direction:ltr;text-align:left}
.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:800;background:var(--orange);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.login .btn{width:100%;margin-top:10px}
.msg{margin:12px 0 0;font-weight:700;font-size:14px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--ink)}
.tab b{display:inline-block;min-width:20px;margin-inline-start:6px;padding:0 6px;border-radius:99px;background:#e8f1f0;font-size:12px}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tab[aria-pressed="true"] b{background:#ffffff22;color:#fff}
.bar .spacer{flex:1}
.list{display:grid;gap:14px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.item header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.item h3{margin:0;font:800 19px Heebo,Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
.kind{font-size:12px;font-weight:800;border-radius:5px;padding:2px 8px;background:#dceeed;color:#1f6670}
.kind.fix{background:#fff0e6;color:#aa522a}
.status{font-size:12px;font-weight:800;border-radius:5px;padding:2px 8px;background:#edf2f2;color:var(--muted)}
.status.approved{background:#ddf0e8;color:var(--ok)}.status.rejected{background:#fde8e6;color:var(--bad)}.status.done{background:#e3e9f7;color:#34518f}
.when{margin-inline-start:auto;font-size:12px;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
dt{color:var(--muted);font-weight:700}
dd{margin:0;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #e8efee;padding-top:10px}
.actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:800;font-size:13px;color:var(--ink)}
.actions .a-approved{border-color:#b9dfc9;color:var(--ok)}
.actions .a-rejected{border-color:#f1c4bf;color:var(--bad)}
.actions .a-done{border-color:#c9d3ee;color:#34518f}
.actions .del{margin-inline-start:auto;color:var(--bad)}
.actions .confirm{display:inline-flex;gap:6px;align-items:center;margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e68f69;outline-offset:2px}
@media(max-width:600px){main{padding:16px 14px 40px}dl{grid-template-columns:1fr}dt{margin-top:4px}}
</style>
</head>
<body>
<div class="top"><div class="in"><h1>ניהול פניות<small>ארסנל הז׳רז׳ור</small></h1><div><a href="./">לאתר ←</a> <button type="button" id="logout" hidden>התנתקות</button></div></div></div>
<main>
<section class="panel login" id="loginView" hidden>
<h2>כניסת מנהל</h2>
<p>נשלח קישור כניסה למייל. הגישה לפניות פתוחה רק לכתובת המנהל.</p>
<form id="loginForm"><label for="email" class="sr">מייל</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><button class="btn" type="submit" id="sendLink">שליחת קישור כניסה</button></form>
<p class="msg" id="loginMsg" role="status"></p>
</section>
<section id="appView" hidden>
<div class="bar" id="tabs" role="group" aria-label="סינון לפי סטטוס"></div>
<p class="msg" id="appMsg" role="status"></p>
<div class="list" id="list"></div>
</section>
</main>
<script>
const SUPABASE_URL='https://necjcplmlfyxzmymiupq.supabase.co';
const SUPABASE_KEY='sb_publishable_9xBWNLiNUyAzIfj8v1di5A_YMScY1Vz';
const REDIRECT=location.origin+location.pathname;
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const STATUS={new:'חדשה',approved:'אושרה',rejected:'נדחתה',done:'בוצעה'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=null,rows=[],filter='new';

// session: token arrives in the URL hash after clicking the email link
(function(){
const h=new URLSearchParams(location.hash.slice(1));
if(h.get('access_token')){try{sessionStorage.setItem('adm',JSON.stringify({t:h.get('access_token'),exp:Date.now()+(Number(h.get('expires_in'))||3600)*1000}))}catch(e){}token=h.get('access_token');history.replaceState(null,'',location.pathname)}
else{try{const s=JSON.parse(sessionStorage.getItem('adm')||'null');if(s&&s.exp>Date.now())token=s.t}catch(e){}}
if(h.get('error_description')){$('loginMsg').textContent='הקישור לא תקף או שפג תוקפו. אפשר לבקש קישור חדש.';$('loginMsg').className='msg err'}
})();

function show(){ $('loginView').hidden=!!token; $('appView').hidden=!token; $('logout').hidden=!token; if(token)load() }
$('logout').onclick=()=>{try{sessionStorage.removeItem('adm')}catch(e){}token=null;rows=[];show()};

$('loginForm').addEventListener('submit',async e=>{
e.preventDefault();const b=$('sendLink'),m=$('loginMsg');b.disabled=true;m.textContent='';m.className='msg';
try{
const r=await fetch(`${SUPABASE_URL}/auth/v1/otp?redirect_to=${encodeURIComponent(REDIRECT)}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({email:$('email').value.trim(),create_user:true})});
if(!r.ok)throw new Error((await r.json().catch(()=>({}))).msg||r.status);
m.textContent='נשלח קישור כניסה. פתחו את המייל ולחצו על הקישור.';m.className='msg ok';
}catch(err){m.textContent='השליחה נכשלה ('+err.message+'). נסו שוב בעוד דקה.';m.className='msg err'}
finally{b.disabled=false}
});

async function api(path,opts={}){
const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+token,...(opts.headers||{})}});
if(r.status===401){$('logout').click();throw new Error('החיבור פג. צריך להתחבר מחדש.')}
if(!r.ok)throw new Error(r.status);
return r.status===204?null:r.json();
}
async function load(){
$('appMsg').textContent='טוען...';$('appMsg').className='msg';
try{rows=await api('lure_suggestions?select=*&order=created_at.desc');$('appMsg').textContent='';render()}
catch(e){$('appMsg').textContent='לא הצלחתי לטעון את הפניות: '+e.message;$('appMsg').className='msg err'}
}
function render(){
const counts={all:rows.length};Object.keys(STATUS).forEach(k=>counts[k]=rows.filter(r=>r.status===k).length);
$('tabs').innerHTML=[['new','חדשות'],['approved','אושרו'],['done','בוצעו'],['rejected','נדחו'],['all','הכול']].map(([k,l])=>`<button type="button" class="tab" data-f="${k}" aria-pressed="${filter===k}">${l}<b>${counts[k]}</b></button>`).join('')+'<span class="spacer"></span><button type="button" class="btn ghost" id="reload">רענון</button>';
const list=rows.filter(r=>filter==='all'||r.status===filter);
$('list').innerHTML=list.length?list.map(item).join(''):`<p class="empty">אין פניות ${filter==='all'?'':'בסטטוס הזה'}.</p>`;
}
function item(r){
const when=new Date(r.created_at).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'});
const season=r.all_year?'כל השנה':(r.months&&r.months.length?r.months.map(m=>MONTHS[m-1]).join(', '):'לא צוין');
const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
return `<article class="item" data-id="${r.id}">
<header><h3>${esc(r.name)}</h3><span class="kind ${r.kind}">${r.kind==='fix'?'תיקון':'דמוי חדש'}</span><span class="status ${r.status}">${STATUS[r.status]||r.status}</span><span class="when">${when}</span></header>
<dl>${row('תיקון ל',r.existing_lure)}${row('משקל / גודל',r.size)}${row('סוג',r.lure_type)}${row('שיטת עבודה',r.method)}${row('דגי מטרה',(r.fish||[]).join(', '))}${row('עונה',season)}${row('אזור',r.zone)}${row('הערות',r.notes)}${row('נשלח ע״י',r.submitted_by)}</dl>
<div class="actions">${['approved','done','rejected','new'].filter(s=>s!==r.status).map(s=>`<button type="button" class="a-${s}" data-set="${s}">${{approved:'אישור',done:'סימון כבוצע',rejected:'דחייה',new:'החזרה לחדשה'}[s]}</button>`).join('')}<button type="button" data-copy>העתקה</button><button type="button" class="del" data-del>מחיקה</button></div>
</article>`;
}
document.addEventListener('click',async e=>{
const t=e.target;
if(t.dataset.f){filter=t.dataset.f;render();return}
if(t.id==='reload'){load();return}
const card=t.closest('.item');if(!card)return;const id=Number(card.dataset.id),r=rows.find(x=>x.id===id);
if(t.dataset.set){t.disabled=true;try{await api(`lure_suggestions?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:t.dataset.set})});r.status=t.dataset.set;render()}catch(err){$('appMsg').textContent='העדכון נכשל: '+err.message;$('appMsg').className='msg err';t.disabled=false}return}
if(t.dataset.copy!==undefined){const txt=card.querySelector('h3').textContent+'\n'+[...card.querySelectorAll('dt')].map(d=>d.textContent+': '+d.nextElementSibling.textContent).join('\n');try{await navigator.clipboard.writeText(txt);t.textContent='הועתק'}catch(err){t.textContent='לא הועתק'}setTimeout(()=>t.textContent='העתקה',1500);return}
if(t.dataset.del!==undefined){t.outerHTML='<span class="confirm">למחוק לצמיתות? <button type="button" data-delyes>כן, למחוק</button><button type="button" data-delno>ביטול</button></span>';return}
if(t.dataset.delno!==undefined){render();return}
if(t.dataset.delyes!==undefined){try{await api(`lure_suggestions?id=eq.${id}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});rows=rows.filter(x=>x.id!==id);render()}catch(err){$('appMsg').textContent='המחיקה נכשלה: '+err.message;$('appMsg').className='msg err'}}
});
show();
</script>
</body>
</html>
